<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChickTrack - History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/chick.png') }}">
</head>
<body class="bg-success-subtle">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('home') }}">ChickTrack 🐥</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('show_orders') }}">Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('expenses') }}">Expenses</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('manage_users') }}">Manage Users</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{{ url_for('history') }}">History</a></li>
                    <li class="nav-item ms-lg-3 text-white-50 small">Hi, {{ user.name }}</li>
                    <li class="nav-item ms-lg-2">
                        <button id="logoutBtn" class="btn btn-sm btn-light">Log out</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Batch Selection -->
    <div class="container mt-3">
        <div class="row g-3">
            <div class="col-md-4">
                <label for="batchSelect" class="form-label">Select Batch</label>
                <select class="form-select" id="batchSelect">
                    <option value="">All Batches</option>
                </select>
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <div class="card shadow-sm rounded">
            <div class="card-body">
                <h4 class="card-title text-success mb-2">History</h4>
                <p class="text-muted small">Every add, edit and delete is recorded here and cannot be changed.</p>
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-bordered align-middle">
                        <thead class="table-success">
                            <tr>
                                <th>When</th>
                                <th>Who</th>
                                <th>Record</th>
                                <th>Action</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                        </tbody>
                    </table>
                </div>
                <p id="emptyMsg" class="text-muted d-none">Nothing recorded yet.</p>
            </div>
        </div>
    </div>

    <script>
        window.CURRENT_USER = {{ user | tojson }};
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/batchManager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/history.js') }}"></script>
</body>
</html>
