<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChickTrack - Expenses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/images/chick.png">
</head>
<body class="bg-success-subtle">

    
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="/home">ChickTrack 🐥</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('orders') }}">Orders</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('expenses') }}">Expenses</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    
    <div class="container mt-5">

        
        <div class="card shadow-sm rounded mb-5">
            <div class="card-body bg-light">
                <h4 class="card-title text-success mb-4">Add New Expense</h4>
                <form id="expenseForm" class="row g-3">

                    <div class="col-md-8">
                        <label for="expenseDesc" class="form-label">Expense Description</label>
                        <input type="text" class="form-control" id="expenseDesc" placeholder="zwiliwa" required>
                    </div>

                    <div class="col-md-4">
                        <label for="expenseAmount" class="form-label">Amount Spent (R)</label>
                        <input type="number" class="form-control" id="expenseAmount" min="0" placeholder="0" required>
                    </div>

                    <div class="col-12 d-flex justify-content-end">
                        <button type="submit" class="btn btn-success mt-3">Add Expense</button>
                    </div>

                </form>
            </div>
        </div>

        
        <div class="card shadow-sm rounded">
            <div class="card-body">
                <h4 class="card-title text-success mb-4">Expenses</h4>
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-bordered align-middle">
                        <thead class="table-success">
                            <tr>
                                <th>Description</th>
                                <th>Amount (R)</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="expensesTableBody">
                            
                            <tr>
                                <td>zwiliwa zwa khudu</td>
                                <td>400</td>
                                <td>2025-09-29</td>
                            </tr>
                            <tr>
                                <td>seila</td>
                                <td>800</td>
                                <td>2025-09-15</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
