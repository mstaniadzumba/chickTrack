<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/chick.png') }}">


    <title>ChickTrack</title>
</head>
<body class="bg-success-subtle">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container-fluid">
    <a class="navbar-brand" href="url_for({{ 'home' }})">ChickTrack 🐥</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('show_orders') }}">Orders</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('expenses') }}">Expenses</a>
        </li>
      </ul>
    </div>
  </div>
</nav>



    <div class="container mt-4">
    <h2 class="text-center mb-4">Dashboard</h2>
    <div class="row g-4">

        <div class="col-md-4">
            <div class="card text-white bg-primary">
                <div class="card-body">
                    <h5 class="card-title">Chickens Bought</h5>
                    <p  id="boughtDisplay" class="card-text display-6 text-center">0</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-white bg-danger">
                <div class="card-body">
                    <h5 class="card-title">Dead chickens</h5>
                    <p  id="deadDisplay" class="card-text display-6 text-center">0</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-white bg-success">
                <div class="card-body">
                    <h5 class="card-title">Live Chickens</h5>
                    <p id="liveDisplay" class="card-text display-6 text-center">0</p>
                </div>
            </div>
        </div>

    </div>
</div>



<div class="container mt-5">
    <h3>Add Batch</h3>
    <form id="batchForm" class="row g-3 mt-3">

        
        <div class="col-md-4">
            <label for="batchDate" class="form-label">Batch Start Date</label>
            <input type="date" class="form-control" id="batchDate" required>
        </div>

        
        <div class="col-md-4">
            <label for="chickBought" class="form-label">Chickens Bought</label>
            <input type="number" class="form-control" id="chickBought" min="0" required>
        </div>


        <div class="col-md-4">
            <label for="chickDead" class="form-label">Chickens Dead</label>
            <input type="number" class="form-control" id="chickDead" min="0" value="0" required>
        </div>

    
        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-success">Add batch</button>
            <button type="button" id="updateBatchBtn" class="btn btn-warning ms-2">Update Batch</button>
        </div>
    </form>
</div>

<div class="container mt-3">
    <div class="row g-3">
        <div class="col-md-4">
            <label for="batchSelect" class="form-label">Select Batch</label>
            <select class="form-select" id="batchSelect">
                <option value="sep2025" selected>September 2025</option>
                <option value="aug2025">August 2025</option>
                <option value="jul2025">July 2025</option>
            </select>
        </div>
    </div>
</div>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/batchManager.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>


    
</body>
</html>
