<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChickTrack - Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/chick.png') }}">
</head>
<body class="bg-success-subtle">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('home') }}">ChickTrack 🐥</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('show_orders') }}">Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('expenses') }}">Expenses</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{{ url_for('manage_users') }}">Manage Users</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('history') }}">History</a></li>
                    <li class="nav-item ms-lg-3 text-white-50 small">Hi, {{ user.name }}</li>
                    <li class="nav-item ms-lg-2">
                        <button id="logoutBtn" class="btn btn-sm btn-light">Log out</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="card shadow-sm rounded mb-5">
            <div class="card-body bg-light">
                <h4 class="card-title text-success mb-4">Add a User</h4>
                <form id="userForm" class="row g-3">

                    <div class="col-md-4">
                        <label for="userName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="userName" required>
                    </div>

                    <div class="col-md-4">
                        <label for="userPhone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="userPhone" required>
                    </div>

                    <div class="col-md-4">
                        <label for="userPassword" class="form-label">Password</label>
                        <input type="text" class="form-control" id="userPassword" required>
                    </div>

                    <div class="col-12 form-check ms-2">
                        <input class="form-check-input" type="checkbox" id="userIsAdmin">
                        <label class="form-check-label" for="userIsAdmin">Make this person an admin (can add batches and delete records)</label>
                    </div>

                    <div class="col-12 d-flex justify-content-end">
                        <button type="submit" class="btn btn-success">Add User</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm rounded">
            <div class="card-body">
                <h4 class="card-title text-success mb-4">Users</h4>
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-bordered align-middle">
                        <thead class="table-success">
                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        window.CURRENT_USER = {{ user | tojson }};
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/batchManager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/manageUsers.js') }}"></script>
</body>
</html>
