<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChickTrack - Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/chick.png') }}">
</head>
<body class="bg-success-subtle">

    
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('home') }}">ChickTrack 🐥</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('show_orders') }}">Orders</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('expenses') }}">Expenses</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Batch Selection -->
    <div class="container mt-3">
        <div class="row g-3">
            <div class="col-md-4">
                <label for="batchSelect" class="form-label">Select Batch</label>
                <select class="form-select" id="batchSelect">
                    <option value="">All Orders</option>
                </select>
            </div>
        </div>
    </div>

    
    <div class="container mt-5">

        <div class="container mt-5">

    
    <div class="card shadow-sm rounded mb-4">
        <div class="card-body bg-light">
            <h4 class="card-title text-success mb-4">Add New Order</h4>
            <form id="orderForm" class="row g-3">

                <div class="col-md-4">
                    <label for="customerName" class="form-label">Customer Name</label>
                    <input type="text" class="form-control" id="customerName" required>
                </div>

                <div class="col-md-4">
                    <label for="customerLocation" class="form-label">Location</label>
                    <input type="text" class="form-control" id="customerLocation" required>
                </div>

                <div class="col-md-4">
                    <label for="customerCell" class="form-label">Cell Number</label>
                    <input type="tel" class="form-control" id="customerCell" required>
                </div>

                <div class="col-md-3">
                    <label for="chickensOrdered" class="form-label">Chickens Ordered</label>
                    <input type="number" class="form-control" id="chickensOrdered" min="1" required>
                </div>

                <div class="col-md-3">
                    <label for="amountPaid" class="form-label">Amount Paid (R)</label>
                    <input type="number" class="form-control" id="amountPaid" min="0" required>
        
                </div>

                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100 mb-2" >Add Order</button>
                </div>

            </form>
        </div>
    </div>


    <div class="card shadow-sm rounded">
        <div class="card-body">
            <h4 class="card-title text-success mb-4">Customer Orders</h4>
            <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered align-middle">
                    <thead class="table-success">
                        <tr>
                            <th>Customer Name</th>
                            <th>Location</th>
                            <th>Cell Number</th>
                            <th>Chickens Ordered</th>
                            <th>Total Amount (R)</th>
                            <th>Amount Paid (R)</th>
                            <th>Outstanding (R)</th>
                            <th>Created By</th>
                            <th>Updated By</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>


</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/batchManager.js') }}"></script>
<script src="{{ url_for('static', filename= 'js/orders.js') }}"></script>

</html>
